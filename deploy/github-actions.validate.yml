name: Offline validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  evidence-and-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_repository.py
      - run: sparkbench serve --config configs/serving.example.json --workloads configs/smoke-workloads.jsonl
      - run: sparkbench hardware --mode base
