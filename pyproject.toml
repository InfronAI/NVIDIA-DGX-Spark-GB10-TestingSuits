[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infron-sparkbench"
version = "0.1.0"
description = "Evidence-first DGX Spark GB10 hardware and inference benchmarks"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["httpx>=0.27,<1", "numpy>=1.24,<3"]

[project.optional-dependencies]
reports = ["beautifulsoup4>=4.12", "markdown>=3.6", "matplotlib>=3.8", "weasyprint>=62"]

[project.scripts]
sparkbench = "sparkbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
